services:
  - type: web
    name: worldintelligence
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: MAPILLARY_TOKENS
        sync: false
      - key: MAPTILER_TOKEN
        sync: false
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
